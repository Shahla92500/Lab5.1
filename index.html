<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Dynamic Shopping Cart</title>
</head>
<body>
  <h1>Dynamic Shopping Cart</h1>
  <div class="grid-container" id="product-container"> 
    <div class="item name" >  <input type="text" id="product-name" placeholder="Product Name"> </div>
    <div class="item pric">  <input type="number" id="product-price" placeholder="Product Price"></div>
    <div class="item butn"> <button id="add-product">Add Product</button> </div> 
  </div>
  <div class="grid-container" id="productItems">
    <ul id="cart"></ul>
  </div>
  <div>
    <h3>Total: $<span id="total-price">0</span></h3>
 </div>
  <script src="script.js"></script>
</body>
</html>
